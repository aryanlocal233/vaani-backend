<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; background: #0b0d12; color: #e8eaef; }
  a { color: #60a5fa; }
  h1, h2 { letter-spacing: -0.01em; }
  .card { background: #12151c; border: 1px solid #22262f; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  input, select, textarea { width: 100%; background: #0b0d12; color: #e8eaef; border: 1px solid #22262f; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; box-sizing: border-box; margin-top: 4px; }
  textarea { min-height: 80px; resize: vertical; }
  label { font-size: 13px; color: #9096a3; display: block; margin-top: 14px; }
  button, .btn { background: #60a5fa; color: #0b0d12; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 18px; display: inline-block; text-decoration: none; }
  button.secondary, .btn.secondary { background: transparent; border: 1px solid #22262f; color: #e8eaef; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #22262f; font-size: 14px; }
  th { color: #9096a3; font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .badge.approved { background: #0f766e33; color: #6ee7b7; }
  .badge.draft { background: #b4530933; color: #fbbf24; }
  .badge.retired { background: #b3261e33; color: #f87171; }
  .badge.emergency { background: #b3261e33; color: #f87171; }
  .error { color: #f87171; margin-top: 10px; }
  .msg { color: #6ee7b7; margin-bottom: 16px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 12px; }
  .stat { background: #0b0d12; border: 1px solid #22262f; border-radius: 10px; padding: 14px; }
  .stat .num { font-size: 24px; font-weight: 700; }
  .stat .label { font-size: 12px; color: #9096a3; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .topbar span { color: #9096a3; font-size: 14px; }
</style>
